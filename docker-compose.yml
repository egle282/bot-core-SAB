version: '3.8'

services:
  # Telegram Bot Worker
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "main.py"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./saveas.db:/app/saveas.db
    depends_on:
      - db

  # Web API Backend (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./saveas.db:/app/saveas.db
    depends_on:
      - db

  # PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saveas_pro}
      POSTGRES_USER: ${POSTGRES_USER:-saveas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saveas_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
