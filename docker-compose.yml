posthog:
    image: posthog/posthog:latest
    ports:
      - "8001:8000"
    environment:
      POSTHOG_SECRET_KEY: "saveas-pro-secret-2025"
      CLICKHOUSE_DATABASE: posthog
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: securepass
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
      - clickhouse

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:23.3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
